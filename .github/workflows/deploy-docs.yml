name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'content/docs/**'
      - 'src/app/docs/**'
      - 'src/lib/source.ts'
      - 'source.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Verify docs build
        run: bunx fumadocs-mdx
