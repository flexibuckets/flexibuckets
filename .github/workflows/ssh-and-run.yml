name: SSH and Run Commands
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Run Remote SSH Command
    runs-on: ubuntu-latest

    steps:
    - name: Execute SSH commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 22

        script: |
          echo "I am now connected to the server!"
          echo "Running a deployment command..."
          whoami
          cd /opt/flexibuckets/ && sudo docker compose down -v
          sudo docker system prune -a --volumes -f
          sudo rm -rf /opt/flexibuckets
          sudo rm -rf /etc/traefik
          cd
          curl -fsSL https://raw.githubusercontent.com/flexibuckets/flexibuckets/main/install.sh | sudo bash